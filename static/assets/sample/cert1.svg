  <text x="250" y="180" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">AWS Certified Solutions Architect</text>
  <text x="250" y="210" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600">Amazon Web Services</text>
  <text x="250" y="240" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">Issued 2025 • Validation ID: AWS-789042</text>
  
  <line x1="150" y1="270" x2="350" y2="270" stroke="#334155" stroke-width="1"/>
  <text x="250" y="300" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">Cloud Architecture &amp; Scalability Accreditation</text>
