      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#certBg)" stroke="#334155" stroke-width="2"/>
  <rect x="15" y="15" width="470" height="320" rx="10" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="6 3"/>
  
  <!-- Ribbon Badge -->
  <circle cx="250" cy="100" r="40" fill="url(#gold)"/>
  <circle cx="250" cy="100" r="32" fill="#0f172a"/>
