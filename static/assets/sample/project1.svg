<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p1Grad)"/>
  <rect x="20" y="20" width="560" height="340" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-width="1"/>
  
  <!-- Neural Net Connections -->
  <line x1="180" y1="140" x2="300" y2="100" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="180" y1="140" x2="300" y2="190" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="180" y1="240" x2="300" y2="190" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="180" y1="240" x2="300" y2="280" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="300" y1="100" x2="420" y2="150" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="300" y1="190" x2="420" y2="150" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="300" y1="190" x2="420" y2="230" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="300" y1="280" x2="420" y2="230" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Nodes -->
  <circle cx="180" cy="140" r="12" fill="#0284c7"/>
  <circle cx="180" cy="240" r="12" fill="#0284c7"/>
  <circle cx="300" cy="100" r="14" fill="#38bdf8"/>
  <circle cx="300" cy="190" r="16" fill="#818cf8"/>
  <circle cx="300" cy="280" r="14" fill="#38bdf8"/>
  <circle cx="420" cy="150" r="15" fill="#a855f7"/>
  <circle cx="420" cy="230" r="15" fill="#a855f7"/>

  <!-- Scanning Eye / Lens -->
  <circle cx="300" cy="190" r="6" fill="#ffffff"/>
  
  <!-- Header Text -->
  <text x="300" y="60" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">VisionAI Neural Engine</text>
  <text x="300" y="340" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Real-Time Object Detection &amp; Computer Vision</text>
</svg>
