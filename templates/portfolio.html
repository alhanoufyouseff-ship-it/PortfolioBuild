<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="modern" data-color="blue-purple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | PortfolioBuild</title>
  <meta name="description" content="Personal Developer Portfolio built with PortfolioBuild">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome 6 Free Vector Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom Design System & Theme Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="min-h-screen text-slate-100 selection:bg-indigo-500 selection:text-white">

  <!-- Interactive AI Neural Network Canvas Background -->
  <canvas id="neural-canvas"></canvas>

  <div class="main-content flex flex-col min-h-screen">
    
    <!-- Top Navigation Bar -->
    <header class="glass-panel border-b border-white/10 px-4 lg:px-8 py-3.5 backdrop-blur-xl">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <a href="/" class="flex items-center gap-2.5 text-xs font-bold text-slate-300 hover:text-white transition">
          <div class="w-7 h-7 rounded-lg bg-gradient-primary flex items-center justify-center text-white text-xs">
            <i class="fa-solid fa-code"></i>
          </div>
          <span>PortfolioBuild</span>
        </a>

        <a href="/" class="px-3.5 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold text-indigo-300 hover:text-white transition flex items-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
          <span>اصنع بورتفوليو خاص بك</span>
        </a>
      </div>
    </header>

    <!-- Main Dynamic Portfolio Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 lg:px-8 py-10">
      <div id="portfolio-container" class="space-y-12">
        <!-- Loading State Spinner -->
        <div class="py-24 text-center space-y-4">
          <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-400"></i>
          <p class="text-xs text-slate-400">جاري تحميل البورتفوليو...</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-white/5">
      <div class="flex items-center justify-center gap-1">
        <span>Powered by</span>
        <a href="/" class="text-indigo-400 hover:underline font-bold">PortfolioBuild</a>
      </div>
    </footer>

  </div>

  <!-- Neural Canvas Engine -->
  <script src="/static/js/neural-canvas.js"></script>

  <script>
    const slugOrId = "{{ slug_or_id }}";

    async function loadPortfolio() {
      const container = document.getElementById('portfolio-container');
      try {
        const res = await fetch(`/api/portfolio/${slugOrId}`);
        const result = await res.json();

        if (!result.success || !result.user) {
          container.innerHTML = `
            <div class="glass-panel p-12 rounded-2xl border border-white/10 text-center space-y-4">
              <i class="fa-solid fa-triangle-exclamation text-4xl text-rose-400"></i>
              <h2 class="text-xl font-bold text-white">لم يتم العثور على هذا البورتفوليو</h2>
              <p class="text-xs text-slate-400">تأكد من صحة الرابط أو أنشئ بورتفوليو جديد.</p>
              <a href="/" class="inline-block px-5 py-2.5 rounded-xl bg-gradient-primary text-white text-xs font-bold">العودة للرئيسية</a>
            </div>
          `;
          return;
        }

        const { user, projects, experiences, certificates, volunteering } = result;

        // Apply theme & color scheme
        const theme = user.theme || 'modern';
        const color = user.color_scheme || 'blue-purple';
        const lang = user.language || 'ar';
        const isAr = lang === 'ar';

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-color', color);
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', isAr ? 'rtl' : 'ltr');
        document.body.setAttribute('dir', isAr ? 'rtl' : 'ltr');
        document.title = `${user.name} | Portfolio`;

        if (window.updateNeuralCanvasColor) window.updateNeuralCanvasColor();

        // Skills list
        const skillsList = (user.skills || '').split(',').map(s => s.trim()).filter(Boolean);

        container.innerHTML = `
          <!-- Hero Section -->
          <header class="glass-panel rounded-2xl p-8 md:p-12 border border-white/10 glow-card">
            <div class="flex flex-col md:flex-row items-center gap-8">
              <div class="relative shrink-0">
                <div class="w-32 h-32 md:w-40 md:h-40 rounded-full overflow-hidden border-2 border-indigo-400/50 shadow-2xl bg-slate-900 flex items-center justify-center">
                  ${user.photo_path 
                    ? `<img src="${user.photo_path}" alt="${escapeHtml(user.name)}" class="w-full h-full object-cover">`
                    : `<div class="text-4xl font-bold text-gradient"><i class="fa-solid fa-code"></i></div>`
                  }
                </div>
              </div>
              <div class="space-y-4 text-center md:text-start flex-1">
                ${user.education ? `
                  <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full badge-tag text-xs font-semibold">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>${escapeHtml(user.education)}</span>
                  </div>
                ` : ''}
                <h1 class="text-3xl md:text-5xl font-black tracking-tight text-white">
                  ${escapeHtml(user.name)}
                </h1>
                <p class="text-slate-300 text-sm md:text-base leading-relaxed max-w-2xl">
                  ${escapeHtml(user.bio)}
                </p>
                <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 pt-2">
                  ${user.linkedin_url ? `
                    <a href="${user.linkedin_url}" target="_blank" class="px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-medium text-slate-200 transition flex items-center gap-2">
                      <i class="fa-brands fa-linkedin text-indigo-400 text-sm"></i>
                      <span>LinkedIn</span>
                    </a>
                  ` : ''}
                  ${user.github_url ? `
                    <a href="${user.github_url}" target="_blank" class="px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-medium text-slate-200 transition flex items-center gap-2">
                      <i class="fa-brands fa-github text-indigo-400 text-sm"></i>
                      <span>GitHub</span>
                    </a>
                  ` : ''}
                  ${user.email ? `
                    <a href="mailto:${user.email}" class="px-4 py-2 rounded-lg bg-gradient-primary text-white text-xs font-medium glow-btn flex items-center gap-2">
                      <i class="fa-solid fa-paper-plane text-xs"></i>
                      <span>${isAr ? 'تواصل معي' : 'Contact Me'}</span>
                    </a>
                  ` : ''}
                </div>
              </div>
            </div>
          </header>

          <!-- Skills Section -->
          ${skillsList.length > 0 ? `
            <section class="space-y-4">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-primary flex items-center justify-center text-white text-sm">
                  <i class="fa-solid fa-layer-group"></i>
                </div>
                <h2 class="text-xl font-bold text-white tracking-wide">${isAr ? 'المهارات التقنية' : 'Technical Arsenal'}</h2>
              </div>
              <div class="glass-panel p-6 rounded-2xl border border-white/10">
                <div class="flex flex-wrap gap-2.5">
                  ${skillsList.map(skill => `
                    <span class="badge-tag px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm">
                      <i class="fa-solid fa-code text-[10px] opacity-70"></i>
                      <span>${escapeHtml(skill)}</span>
                    </span>
                  `).join('')}
                </div>
              </div>
            </section>
          ` : ''}

          <!-- Projects Section -->
          ${projects && projects.length > 0 ? `
            <section class="space-y-6">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-primary flex items-center justify-center text-white text-sm">
                  <i class="fa-solid fa-cubes"></i>
                </div>
                <h2 class="text-xl font-bold text-white tracking-wide">${isAr ? 'المشاريع والأعمال' : 'Featured Projects'}</h2>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                ${projects.map(proj => `
                  <div class="glass-panel rounded-2xl overflow-hidden border border-white/10 flex flex-col glow-card group">
                    <div class="w-full h-44 bg-slate-900 relative overflow-hidden border-b border-white/10">
                      ${proj.image_path 
                        ? `<img src="${proj.image_path}" alt="${escapeHtml(proj.title)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">`
                        : `<div class="w-full h-full flex items-center justify-center text-3xl text-slate-700"><i class="fa-solid fa-laptop-code"></i></div>`
                      }
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                      <div class="space-y-2">
                        <h3 class="font-bold text-base text-white group-hover:text-indigo-300 transition">
                          ${escapeHtml(proj.title)}
                        </h3>
                        <p class="text-xs text-slate-300 leading-relaxed line-clamp-3">
                          ${escapeHtml(proj.description)}
                        </p>
                      </div>
                      
                      <div class="space-y-4">
                        ${proj.tags ? `
                          <div class="flex flex-wrap gap-1.5">
                            ${proj.tags.split(',').map(tag => tag.trim()).filter(Boolean).map(tag => `
                              <span class="text-[10px] px-2 py-0.5 rounded bg-white/5 text-indigo-300 border border-white/5 font-mono">
                                ${escapeHtml(tag)}
                              </span>
                            `).join('')}
                          </div>
                        ` : ''}

                        ${proj.project_link ? `
                          <a href="${proj.project_link}" target="_blank" class="w-full py-2 px-3 rounded-lg bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/30 text-xs font-semibold transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                            <span>${isAr ? 'عرض المشروع' : 'View Demo'}</span>
                          </a>
                        ` : ''}
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          <!-- Grid for Experience & Certificates -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Work Experience -->
            ${experiences && experiences.length > 0 ? `
              <section class="space-y-4">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-lg bg-gradient-primary flex items-center justify-center text-white text-sm">
                    <i class="fa-solid fa-briefcase"></i>
                  </div>
                  <h2 class="text-xl font-bold text-white tracking-wide">${isAr ? 'الخبرات العملية والتدريب' : 'Experience'}</h2>
                </div>
                <div class="glass-panel p-6 rounded-2xl border border-white/10 space-y-6">
                  ${experiences.map((exp, i) => `
                    <div class="relative ${i < experiences.length - 1 ? 'pb-6 border-b border-white/5' : ''}">
                      <div class="flex items-start justify-between gap-2">
                        <h3 class="font-bold text-sm text-white">${escapeHtml(exp.title)}</h3>
                        <span class="text-[11px] px-2 py-0.5 rounded bg-white/5 text-slate-400 font-mono">${escapeHtml(exp.duration)}</span>
                      </div>
                      <div class="text-xs font-semibold text-indigo-300 mt-0.5">${escapeHtml(exp.company)}</div>
                      <p class="text-xs text-slate-300 mt-2 leading-relaxed">${escapeHtml(exp.description)}</p>
                    </div>
                  `).join('')}
                </div>
              </section>
            ` : ''}

            <!-- Certificates -->
            ${certificates && certificates.length > 0 ? `
              <section class="space-y-4">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-lg bg-gradient-primary flex items-center justify-center text-white text-sm">
                    <i class="fa-solid fa-award"></i>
                  </div>
                  <h2 class="text-xl font-bold text-white tracking-wide">${isAr ? 'الشهادات والاعتمادات' : 'Certifications'}</h2>
                </div>
                <div class="glass-panel p-6 rounded-2xl border border-white/10 space-y-4">
                  ${certificates.map(cert => `
                    <div class="flex items-center gap-4 p-3 rounded-xl bg-white/5 border border-white/5">
                      <div class="w-12 h-12 rounded-lg bg-slate-900 border border-white/10 overflow-hidden shrink-0 flex items-center justify-center">
                        ${cert.image_path 
                          ? `<img src="${cert.image_path}" class="w-full h-full object-cover">`
                          : `<i class="fa-solid fa-certificate text-indigo-400 text-base"></i>`
                        }
                      </div>
                      <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-xs md:text-sm text-white truncate">${escapeHtml(cert.title)}</h3>
                        <div class="text-[11px] text-slate-400 flex items-center gap-2 mt-0.5">
                          <span class="text-indigo-300">${escapeHtml(cert.issuer)}</span>
                          ${cert.year ? `<span>•</span><span>${escapeHtml(cert.year)}</span>` : ''}
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </section>
            ` : ''}
          </div>

          <!-- Volunteering & Student Clubs (Placed at the bottom before Contact) -->
          ${volunteering && volunteering.length > 0 ? `
            <section class="space-y-6">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-primary flex items-center justify-center text-white text-sm">
                  <i class="fa-solid fa-users"></i>
                </div>
                <h2 class="text-xl font-bold text-white tracking-wide">${isAr ? 'الأنشطة التطوعية والنوادي الطلابية' : 'Volunteering & Student Clubs'}</h2>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                ${volunteering.map(vol => `
                  <div class="glass-panel p-6 rounded-2xl border border-white/10 flex items-start gap-4 glow-card">
                    <div class="w-14 h-14 rounded-xl bg-slate-900 border border-white/10 overflow-hidden shrink-0 flex items-center justify-center">
                      ${vol.logo_path 
                        ? `<img src="${vol.logo_path}" class="w-full h-full object-cover">`
                        : `<i class="fa-solid fa-hands-holding-circle text-indigo-400 text-xl"></i>`
                      }
                    </div>
                    <div class="flex-1 space-y-1.5 min-w-0">
                      <div class="flex items-start justify-between gap-2">
                        <h3 class="font-bold text-sm text-white truncate">${escapeHtml(vol.role)}</h3>
                        <span class="text-[10px] px-2 py-0.5 rounded bg-white/5 text-slate-400 shrink-0 font-mono">${escapeHtml(vol.duration)}</span>
                      </div>
                      <div class="text-xs font-semibold text-indigo-300">${escapeHtml(vol.organization)}</div>
                      <p class="text-xs text-slate-300 leading-relaxed pt-1">${escapeHtml(vol.description)}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          <!-- Contact Section -->
          <footer class="glass-panel rounded-2xl p-8 md:p-10 border border-white/10 text-center space-y-6">
            <div class="max-w-md mx-auto space-y-2">
              <h2 class="text-2xl font-black text-white">${isAr ? 'تواصل معي' : 'Get in Touch'}</h2>
              <p class="text-xs md:text-sm text-slate-300">${isAr ? 'يسعدني التواصل معك واستقبال الفرص والمقترحات!' : 'Feel free to reach out for collaborations or opportunities!'}</p>
            </div>
            
            <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
              ${user.email ? `
                <a href="mailto:${user.email}" class="px-5 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-sm font-semibold text-white transition flex items-center gap-2.5 glow-btn">
                  <i class="fa-solid fa-envelope text-indigo-400"></i>
                  <span>${escapeHtml(user.email)}</span>
                </a>
              ` : ''}
              ${user.phone ? `
                <a href="tel:${user.phone}" class="px-5 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-sm font-semibold text-white transition flex items-center gap-2.5 glow-btn">
                  <i class="fa-solid fa-phone text-emerald-400"></i>
                  <span>${escapeHtml(user.phone)}</span>
                </a>
              ` : ''}
              ${user.linkedin_url ? `
                <a href="${user.linkedin_url}" target="_blank" class="px-5 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-sm font-semibold text-white transition flex items-center gap-2.5 glow-btn">
                  <i class="fa-brands fa-linkedin text-sky-400"></i>
                  <span>LinkedIn</span>
                </a>
              ` : ''}
              ${user.github_url ? `
                <a href="${user.github_url}" target="_blank" class="px-5 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-sm font-semibold text-white transition flex items-center gap-2.5 glow-btn">
                  <i class="fa-brands fa-github text-purple-400"></i>
                  <span>GitHub</span>
                </a>
              ` : ''}
            </div>
          </footer>
        `;
      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="glass-panel p-12 rounded-2xl border border-white/10 text-center space-y-4">
            <i class="fa-solid fa-circle-exclamation text-4xl text-rose-400"></i>
            <h2 class="text-xl font-bold text-white">حدث خطأ أثناء تحميل البيانات</h2>
          </div>
        `;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.addEventListener('DOMContentLoaded', loadPortfolio);
  </script>
</body>
</html>
